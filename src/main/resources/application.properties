spring.application.name=SecureAuth

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/secureauth_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:5GvrBQFPiocls+g8SGWSuXIyDVgmhmfD1eDEh+QKRQYb8Pu5/57SCVdXUCHMwmpC7yAApEOHWSCBarsPAR9sTQ==}
app.jwt.expiration=900000

# CORS
app.cors.allowed-origins=http://localhost:5173
# Your own code
logging.level.com.secureauth=DEBUG

# Request mapping, argument binding, JSON conversion
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
spring.mvc.log-request-details=true

# Security filter chain (shows which filter handles or blocks each request)
logging.level.org.springframework.security=DEBUG

# SQL (if you want to see queries)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

logging.level.root=INFO
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

server.error.include-message=always
server.error.include-binding-errors=always
